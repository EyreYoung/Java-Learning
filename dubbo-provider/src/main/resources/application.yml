spring:
  application:
    name: dubbo-provider
  main:
    web-application-type: none
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

dubbo:
  application:
    name: dubbo-provider
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://localhost:2181}
    check: false
  provider:
    timeout: 1000
