server:
  port: 8080

spring:
  application:
    name: dubbo-consumer
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

dubbo:
  application:
    name: dubbo-consumer
  registry:
#    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://localhost:2181}
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://localhost:8848}
    check: false
    register-mode: instance
  consumer:
    check: false
    timeout: 3000
